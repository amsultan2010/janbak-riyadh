name: Bug report
description: Something on the site does not work or looks broken
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in Arabic or English.
        For a security problem, do not open an issue: see SECURITY.md.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page where it happens.
      placeholder: https://www.janbaksa.com/en/places/pharmacies/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the page
      options:
        - Arabic
        - English
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18
    validations:
      required: true
